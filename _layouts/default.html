<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2aa4cf">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <svg
    width="0"
    height="0"
    aria-hidden="true"
    style="position: absolute;"
  >
    <defs>
      <clipPath
        id="smooth-bookmark"
        clipPathUnits="objectBoundingBox"
      >
        <path d="
          M 0 0
          H 0.90
          C 0.955 0, 1 0.08, 1 0.18
          V 0.82
          C 1 0.92, 0.955 1, 0.90 1
          H 0
          L 0.145 0.5
          Z
        "/>
      </clipPath>
    </defs>
  </svg>
  {% include header.html %}
  {{ content }}
  <script src="{{ '/main.js' | relative_url }}" defer></script>
</body>
</html>
